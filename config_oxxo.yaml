# =============================================================================
#  Configuración de UN cruce  ·  Ejemplo: cruce OXXO (Guadalajara)
# -----------------------------------------------------------------------------
#  Todas las coordenadas están en PIXELES de la resolución original del video
#  (aquí se asume 1920x1080). Obtenlas con:
#      python main.py puntos --config config.yaml --segundo 10
#  y valida el resultado con:
#      python main.py diagrama --config config.yaml   ->  gdl/oxxo/diagrama.png
#
#  Para otro cruce: copia este archivo (config_plaza.yaml, config_mangueras.yaml),
#  cambia cruce.id / carpeta_salida / videos y vuelve a trazar líneas y zonas.
#  Las rutas relativas se resuelven respecto a la carpeta de ESTE archivo.
# =============================================================================

cruce:
  id: oxxo
  nombre: "Cruce OXXO"
  carpeta_salida: gdl/oxxo            # aquí quedan los 14 archivos del contrato

# -----------------------------------------------------------------------------
# Videos del cruce. `inicio` = fecha y hora REAL del primer frame (se usa para
# todos los timestamps). clima / luz / incidencias van a videos.csv.
# -----------------------------------------------------------------------------
videos:
  - archivo: data/Miercoles (1)/oxxo_n.avi
    inicio: "2026-10-15 17:30:11"
    clima: nublado
    luz: dia
    incidencias: ""
  # - archivo: videos/oxxo/oxxo_2026-10-15_1830.mp4
  #   inicio: "2026-10-15 18:30:00"
  #   clima: lluvia
  #   luz: atardecer
  #   incidencias: "camion de basura detenido 18:42-18:47"

# -----------------------------------------------------------------------------
# Modelo de detección (ultralytics)
# -----------------------------------------------------------------------------
modelo:
  pesos: yolo11n.pt                   # rápido. Alternativa: yolov8n.pt
  # pesos: modelos/best.pt            # <- modelo reentrenado (p. ej. con clase pickup)
  confianza: 0.25
  iou: 0.5
  imgsz: 960                          # 960-1280 ayuda con vehículos lejanos
  dispositivo: null                   # null = auto | "cpu" | "0" (GPU 0)
  tracker: trackers/bytetrack_oclusion.yaml   # o trackers/botsort_oclusion.yaml
  # id de clase del modelo -> nombre de clase en el estudio (COCO por defecto)
  clases:
    2: auto
    3: moto
    5: autobus
    7: camion
  # Con best.pt ajusta los ids a tu data.yaml, p. ej.:
  #   0: auto
  #   1: pickup
  #   2: moto
  #   3: autobus
  #   4: camion

# -----------------------------------------------------------------------------
# Procesamiento
# -----------------------------------------------------------------------------
procesamiento:
  frame_stride: 1                     # 1 = todos los frames (recomendado). 2 = mitad de costo
  punto_referencia: base              # base = centro inferior de la caja (mejor para líneas en el piso)
  segundos_perdida: 4.0               # tiempo sin ver un ID antes de cerrarlo como "perdido"
  revinculacion:                      # 2a capa anti-oclusión (ver README)
    activa: true
    max_segundos: 2.5
    max_distancia_px: 90
  diagrama_segundo: 5
  log_cada_segundos: 60

# -----------------------------------------------------------------------------
# Accesos (entradas al cruce). Orden geométrico: sentido horario desde el norte.
#   linea     : 2 puntos que atraviesan SOLO los carriles de entrada
#   hacia     : punto del lado al que avanza el vehículo (define el sentido válido)
#   zona_cola : polígono aguas arriba de la línea, donde se forma la fila
#   semaforo  : id del semáforo que controla este acceso
# -----------------------------------------------------------------------------
accesos:
  - id: N
    nombre: "Avenida Aviación, entrando desde el norte"
    orden: 1
    linea: [[838, 209], [454, 220]]
    hacia: [673, 296]

  - id: S
    nombre: "Avenida Aviación, entrando desde el sur"
    orden: 3
    linea: [[1278, 259], [905, 278]]
    hacia: [1016, 232]

  - id: O
    nombre: "Avenida 5 de Mayo, entrando desde el poniente"
    orden: 4
    linea: [[256, 440], [0, 667]]
    hacia: [306, 556]

# -----------------------------------------------------------------------------
# Salidas del cruce (mismo formato; `hacia` apunta hacia afuera del cruce)
# -----------------------------------------------------------------------------
salidas:
  - id: sal_S
    nombre: "Salida hacia el sur (dirección Tec)"
    orden: 3
    linea: [[200, 544], [1015, 532]]
    hacia: [553, 665]

  - id: sal_E
    nombre: "Salida de Avenida Aviación hacia 5 de Mayo (Este)"
    orden: 2
    linea: [[912, 322], [1090, 710]]
    hacia: [1186, 534]

  - id: sal_N
    nombre: "Salida de Aviación hacia el norte"
    orden: 1
    linea: [[855, 195], [1092, 186]]
    hacia: [933, 156]

# -----------------------------------------------------------------------------
# Movimientos: qué vuelta es cada combinación acceso -> salida
# (circulación por la derecha). Omite las combinaciones prohibidas: si un
# vehículo las hace, queda como "combinacion_no_configurada" en eventos.csv.
# -----------------------------------------------------------------------------
movimientos:
  # Desde el Norte (va hacia el Sur)
  - {acceso: N, salida: sal_S, movimiento: frente}
  - {acceso: N, salida: sal_E, movimiento: izquierda}
  
  # Desde el Sur (va hacia el Norte)
  - {acceso: S, salida: sal_N, movimiento: frente}
    
  # Desde el Poniente (va hacia el Oriente)
  - {acceso: O, salida: sal_E, movimiento: frente}
# -----------------------------------------------------------------------------
# Semáforos visibles en cámara.
# -----------------------------------------------------------------------------
semaforos: [] 

# Agregación temporal
agregacion:
  minutos_conteo: 5
  minutos_tau: 10
